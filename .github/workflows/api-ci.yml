name: API-CI
on:
  push:
    paths:
      - "./api/**"
      - ".github/workflows/api-ci.yml"

defaults:
  run:
    working-directory: ./api

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: ./api/package-lock.json

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Run unit tests
        shell: bash
        run: npm run test

      - name: Run e2e tests
        shell: bash
        run: npm run test:e2e

  e2e:
    runs-on: ubuntu-latest
    container: node:14

    services:
      mongo-e2e:
        image: mongo:4.4
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: test123

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Run e2e tests
        shell: bash
        run: npm run test:e2e
        env:
          MONGO_DB_NAME: "demo"
          MONGO_URL: "mongodb://test:test123@mongo-e2e:27017/demo?authSource=admin"
